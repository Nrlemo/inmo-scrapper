# Publica la web detrás de Traefik con TLS (para AUTH_MODE=basic o none). Con authentik, sumá también
# docker-compose.authentik.yml. Variables en .env (ver .env.example).
services:
  web:
    networks: [default, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK}
      traefik.http.services.inmo.loadbalancer.server.port: "8000"
      traefik.http.routers.inmo.rule: Host(`${INMO_DOMAIN}`)
      traefik.http.routers.inmo.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.inmo.tls.certresolver: ${TRAEFIK_CERTRESOLVER}
networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK}
