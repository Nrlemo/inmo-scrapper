# Base neutra: sin puertos publicados. Elegí un complemento:
#   Producción con Traefik + authentik:  docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d --build
#   Prueba local (sin authentik):        docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  web:
    build: { context: ., dockerfile: Dockerfile }
    image: inmo-web:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Argentina/Buenos_Aires}   # las fechas del scrapper son locales, sin zona
      PROXY_SECRET: ${PROXY_SECRET:-}             # si se define, el proxy debe enviarlo en X-Proxy-Secret
      RUN_ALLOWED_USERS: ${RUN_ALLOWED_USERS:-}   # usuarios que pueden lanzar el scrapper (vacío = todos)
      AUTH_DISABLED: ${AUTH_DISABLED:-false}      # true = sin autenticación (todos actúan como AUTH_DEFAULT_USER)
      AUTH_DEFAULT_USER: ${AUTH_DEFAULT_USER:-anonimo}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}   # programador diario (se activa desde Estado)
    volumes:
      - ./scrapper/data:/data                     # SQLite + logs de corridas (persistente)
      - ./scrapper/config:/config:ro              # profiles.yaml (perfiles, zonas, cortesía)
    expose: ["8000"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
