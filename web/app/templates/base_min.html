<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark"><meta name="theme-color" content="#1b6b58"><meta name="robots" content="noindex,nofollow">
<title>{% block title %}Inmo{% endblock %}</title>
<link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml"><link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/app.css?v=8">
</head><body>
<main class="auth-wrap">
  <div class="auth-brand"><picture><source srcset="/static/icons/icon-dark.svg" media="(prefers-color-scheme: dark)"><img class="logo" src="/static/icons/icon.svg" alt="" width="40" height="40"></picture><b>Inmo</b></div>
  <div class="card in">{% block body %}{% endblock %}</div>
</main>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js',{scope:'/'});</script>
</body></html>
