# Local / red privada: publica el puerto sólo en 127.0.0.1 (cambiá a "8000:8000" para exponerlo en tu LAN;
# sin HTTPS las cookies no llevan Secure, así que en una LAN abierta preferí un proxy con TLS).
services:
  web:
    ports: ["127.0.0.1:8000:8000"]
    environment:
      TRUSTED_PROXY_HOPS: "0"      # acceso directo, sin proxy: no confiar en X-Forwarded-*
